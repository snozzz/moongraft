name: Publish to mooncakes.io

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install latest MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Authenticate with mooncakes.io and publish module
        env:
          MOONCAKES_OAUTH_CODE: ${{ secrets.MOONCAKES_OAUTH_CODE }}
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}
        run: |
          python3 -u - <<'PY'
          import json, os, pty, select, sys, time, urllib.request

          creds_json = os.environ.get("MOONCAKES_CREDENTIALS", "").strip()
          code = os.environ.get("MOONCAKES_OAUTH_CODE", "").strip()

          def run_pty_cmd(argv, step_label, feed_rules, timeout_sec=90):
              pid, fd = pty.fork()
              if pid == 0:
                  os.execvp(argv[0], argv)
              buf = b""
              fired = set()
              t0 = time.time()
              while time.time() - t0 < timeout_sec:
                  r, _, _ = select.select([fd], [], [], 0.25)
                  if r:
                      try:
                          chunk = os.read(fd, 4096)
                      except OSError:
                          break
                      if not chunk:
                          break
                      buf += chunk
                      txt = chunk.decode("utf-8", errors="replace")
                      if code:
                          txt = txt.replace(code, "***")
                      print(txt, end="", flush=True)
                      for idx, (needle, reply) in enumerate(feed_rules):
                          if idx not in fired and needle in buf:
                              time.sleep(0.25)
                              os.write(fd, reply)
                              fired.add(idx)
              _, st = os.waitpid(pid, 0)
              rc = os.WEXITSTATUS(st)
              clean_out = buf.decode("utf-8", errors="replace")
              if code:
                  clean_out = clean_out.replace(code, "***")
              clean_one_line = " | ".join(
                  ln.strip() for ln in clean_out.splitlines() if ln.strip()
              )[-400:]
              if rc != 0:
                  print(f"\n::error title={step_label}::{clean_one_line}", flush=True)
              else:
                  print(f"\n::notice title={step_label}::Succeeded ({clean_one_line})", flush=True)
              return rc

          if creds_json:
              os.makedirs(os.path.expanduser("~/.moon"), exist_ok=True)
              with open(os.path.expanduser("~/.moon/credentials.json"), "w", encoding="utf-8") as f:
                  f.write(creds_json)
          elif code:
              # Check whether GitHub username `snozzz` is already registered on mooncakes.io
              chk_url = "https://mooncakes.io/api/v0/username_validity_checks?username=snozzz"
              req = urllib.request.urlopen(chk_url, timeout=15)
              chk = json.loads(req.read().decode("utf-8"))
              print("username_validity_checks(snozzz):", chk, flush=True)
              is_unregistered = bool(chk.get("ok", False))

              if is_unregistered:
                  rc = run_pty_cmd(
                      ["moon", "register"],
                      "moon-register",
                      [
                          (b"Github", b"\x1b[B\r"),
                          (b"Please input the code:", (code + "\r").encode("utf-8")),
                          (b"username", b"snozzz\r"),
                          (b"(Y/N)", b"Y\r"),
                      ],
                  )
              else:
                  rc = run_pty_cmd(
                      ["moon", "login"],
                      "moon-login",
                      [
                          (b"Github", b"\x1b[B\r"),
                          (b"Please input the code:", (code + "\r").encode("utf-8")),
                          (b"(Y/N)", b"Y\r"),
                      ],
                  )
              if rc != 0:
                  sys.exit(rc)
          else:
              print("::error title=auth::Neither MOONCAKES_CREDENTIALS nor MOONCAKES_OAUTH_CODE was set", flush=True)
              sys.exit(1)

          rc2 = run_pty_cmd(
              ["moon", "publish", "--verbose"],
              "moon-publish",
              [(b"(Y/N)", b"Y\r")],
              timeout_sec=120,
          )
          sys.exit(rc2)
          PY
